<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>gSm Designer Classic</title>
    <link rel='stylesheet' href='designer.css'>
</head>
<body>

    <main>
        <div class="designer-main">
            <div class="wall menu">
                <section class="window">
                    <h2>Tools</h2>
                    <hr>
                    <div class="tools">
                        <div class="option" id="drawButton"><div class="icon"></div><span>Draw</span></div>
                        <div class="option unfinished" id="eraseButton"><div class="icon"></div><span>Erase</span></div>
                        <div class="option unfinished" id="sampleButton"><div class="icon"></div><span>Sample</span></div>
                        <div class="option unfinished" id="selectButton"><div class="icon"></div><span>Select</span></div>
                        <div class="option unfinished" id="fillButton"><div class="icon"></div><span>Fill</span></div>
                        <div class="option unfinished" id="replaceButton"><div class="icon"></div><span>Replace</span></div>
                    </div>
                    <hr>
                    <div class="tools">
                        <div class="option" id="undoButton"><div class="icon"></div><span>undo</span></div>
                        <div class="option" id="redoButton"><div class="icon"></div><span>redo</span></div>
                    </div>
                </section>

                <section class="window">
                    <h2>Pen Settings</h2>
                    <hr>
                    <div class="window-group">
                        <span>Pen Presets</span>
                        <div id="brushPresets">
                        </div>
                    </div>
                </section>

                <section class="window">
                    <h2>Brush Settings</h2>
                    <hr>
                    <div class="brushPreviewContainer">
                        <canvas id="brushPreviewCanvas" width="20" height="20"></canvas>
                    </div>

                    <div class="window-group">
                        <label>Size: <span id="brushSizeText">5</span>px</label>
                        <input type="range" min="1" max="100" step="1" value="5" id="brushSizeRange">
                    </div>

                    <div class="window-group">
                        <label>Hardness: <span id="brushHardnessText">100</span>%</label>
                        <input type="range" min="0" max="100" step="1" value="100" id="brushHardnessRange">
                    </div>
                    
                    <div class="window-group">
                        <label>Spacing: <span id="brushSpacingText">20</span>%</label>
                        <input type="range" min="0" max="200" step="1" value="20" id="brushSpacingRange">
                    </div>

                    <hr>
                    
                    <div class="window-group">
                        <label>Opacity: <span id="brushOpacityText">100</span>%</label>
                        <input type="range" min="1" max="100" step="1" value="100" id="brushOpacityRange">
                    </div>

                    <div class="window-group">
                        <label>Flow: <span id="brushFlowText">100</span>%</label>
                        <input type="range" min="1" max="100" step="1" value="100" id="brushFlowRange">
                    </div>

                </section>

                <section class="window">
                    <h2>Color</h2>
                    <hr>
                    <div id="colorPreview"></div>
                    <div class="window-group">
                        <label>Red: <span id="redText">255</span></label>
                        <input type="range" min="0" max="255" step="1" value="0" id="redRange">
                    </div>
                    <div class="window-group">
                        <label>Green: <span id="greenText">0</span></label>
                        <input type="range" min="0" max="255" step="1" value="0" id="greenRange">
                    </div>
                    <div class="window-group">
                        <label>Blue: <span id="blueText">0</span></label>
                        <input type="range" min="0" max="255" step="1" value="0" id="blueRange">
                    </div>
                   
                </section>


                <section class="window">
                    <h2>Background</h2>
                    <hr>
                    <div class="window-group unfinished">
                        <div>
                            <input name="background" id="backgroundFillRadio" type="radio">
                            <label for="backgroundFillRadio">Fill</label>
                        </div>
                        
                        <div>
                            <input name="background" id="backgroundCheckerRadio" type="radio" checked>
                            <label for="backgroundCheckerRadio">Checker</label>
                        </div>
                    </div>
                    
                </section>

            </div>
            <div class="resize-handle"></div>

            <div class="wall main">
                <div id="easel">
                    <canvas width="200" height="300px" id="baseCanvas"></canvas>
                    <canvas width="200" height="300px" id="topCanvas"></canvas>
                </div>
                
            </div>

            <div class="resize-handle"></div>
            <div class="wall menu">
                <section class="window">
                    <h2>Navigation</h2>
                    <hr>
                    <div class="previewContainer"><canvas id="previewCanvas" width="200" height="300"></canvas></div>
                    <hr>
                    <div class="zoom-buttons">
                        <button class="button" id="zoomOutButton">-</button>
                        <span id="zoomText">1x</span>
                        <button class="button" id="zoomInButton">+</button>
                    </div>
                </section>
                <section class="window">
                    <h2>Settings</h2>
                    <hr>
                    <div class="window-group unfinished">
                        <label>Theme:</label>
                        <select>
                            <option>2.0</option>
                            <option>Classic</option>
                            <option selected>Retro</option>
                        </select>
                    </div>
                    <div class="window-group align-row unfinished">
                        <label>Advanced tools:</label>
                        <input type="checkbox" checked>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer><p>Assets borrowed from goSupermodel.com | All right reserved.</p></footer>

    <div class="settings-window hidden">
        <div class="settings-topbar">
            <h1>Color picker</h1>
            <button class="close-button button"><img src="https://cdn.gosupermodel.com/images/buttons/icons_white/cross.png#png8"></button>
        </div>
        <div class="settings-content"><p>content content...</p></div>
    </div>
    <script src="designer.js"></script>
</body>
</html>
